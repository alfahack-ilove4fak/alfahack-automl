# Единый источник задач команды (пункт 3.4).
# Из этого файла:
#   uv run python scripts/tasks.py render   → чек-листы в docs/roles/<роль>.md (между маркерами)
#   uv run python scripts/tasks.py issues   → issue на GitHub + доска (повторный запуск не дублирует)
# Правим задачи ТОЛЬКО здесь, потом render.
#
# Поля: id, role, level (L0–L3), cp (CP0–CP5), title, why, steps[], done[], handoff (с кем/когда/что — необязательно)
# Уровни: L0 — разогрев (первый час), L1 — базовые, L2 — основные, L3 — «на победу».

tasks:
  # ======================================================================= captain
  - id: C-L0-1
    role: captain
    level: L0
    cp: CP0
    title: Провести CP0 — у всех зелёный doctor
    why: Правило команды — к кейсу приступаем только с рабочим окружением.
    steps:
      - В 10:00 на стендапе раздать ссылки на START_HERE.md каждому.
      - До 11:30 обойти всех; у кого ❌ — вместе с QA разобрать по подсказкам doctor.
      - Закрыть issue «CP0» на доске, когда отметились все.
    done:
      - У каждого `doctor.py --role <роль>` — «ГОТОВ К РАБОТЕ».
    handoff: qa помогает чинить окружения; все отмечаются в issue CP0.

  - id: C-L1-1
    role: captain
    level: L1
    cp: CP1
    title: Утвердить контракты v1 (interfaces/)
    why: Контракты позволяют всем работать параллельно, не ломая друг друга.
    steps:
      - В 13:00 — встреча на 30 минут: пройти interfaces/schemas.py поле за полем.
      - Каждый владелец говорит, чего ему не хватает; правки — в один PR по процессу из CONTRIBUTING.md.
      - После одобрения всеми — тег `contracts-v1` на dev.
    done:
      - PR с правками контрактов слит, `tests/contracts` зелёные, тег `contracts-v1` есть.
    handoff: "21.10 13:00 — все владельцы модулей: что нужно добавить в контракты."

  - id: C-L1-2
    role: captain
    level: L1
    cp: CP1
    title: Задать вопросы организаторам
    why: Неясности в условиях могут стоить нам сабмита или баллов.
    steps:
      - "В чат хакатона: script.py или solution.py в приложении 2?"
      - "`baseline.py` импортирует `mcp`, которого нет в requirements.txt — он есть в контейнере?"
      - Точное время дедлайна; формат защиты; цена токенов Qwen (для учёта ₽ в агенте).
      - Ответы — в docs/architecture.md (раздел «Важные факты») и в чат команды.
    done:
      - Все ⚠️ в docs/architecture.md заменены на ответы организаторов.

  - id: C-L1-3
    role: captain
    level: L1
    cp: CP2
    title: Сабмит №1 — проверить, что платформа принимает наш формат
    why: Первая точка public score и проверка всего пути сдачи.
    steps:
      - "/submit-check в Claude Code."
      - Собрать zip (`scripts/package_submission.py`) или взять артефакт workflow run-agent.
      - Загрузить на платформу, записать результат в docs/submissions.md.
    done:
      - Платформа приняла архив, есть public score, строка в журнале сабмитов.
    handoff: qa — проверка перед сабмитом.

  - id: C-L2-1
    role: captain
    level: L2
    cp: CP3
    title: Песочница для кода от LLM (runtime/sandbox.py)
    why: Код, который пишет LLM, не должен уронить агента или съесть всю память.
    steps:
      - Изучить `run_python` в reference/baseline.py и docs/resources/captain.md (subprocess, resource).
      - "Сделать `run_code(code, workdir, timeout, mem_mb) -> {stdout, stderr, exit_code}`: отдельный процесс, таймаут, лимит памяти (Linux), чистое окружение."
      - Тесты: бесконечный цикл, переполнение памяти, исключение, нормальный код.
    done:
      - Функция в runtime/, тесты зелёные, agent-инженер знает, как её вызывать.
    handoff: agent — использует песочницу для генерации признаков (задача A-L3-1).

  - id: C-L2-2
    role: captain
    level: L2
    cp: CP3
    title: Распределение 3 часов между этапами агента
    why: Нужно успеть и исследовать, и надёжно обучить финальную модель.
    steps:
      - Замерить на run-agent время бейзлайна и финального обучения на полных данных.
      - "Ввести доли бюджета (например: разбор+бейзлайн ≤ 20%, AutoResearch ~70%, финал ≥ 10%) в runtime/budget.py."
      - Проверить на прогоне с `AGENT_TIME_BUDGET_SEC=1800`, что финал всегда успевает.
    done:
      - Агент заканчивает с запасом ≥ 5% времени на любой задаче харнесса.
    handoff: agent и ml — согласовать, кто следит за бюджетом внутри цикла.

  - id: C-L2-3
    role: captain
    level: L2
    cp: CP3
    title: Вечерний релиз dev → main и тег сабмита
    why: Сабмитим только проверенное и воспроизводимое.
    steps:
      - После окна интеграции 18:30 — PR `dev → main` «релиз: …», ревью QA.
      - Слить, поставить тег `sub-ГГГГ-ММ-ДД-N`, сабмит по /submit-check.
    done:
      - Каждый сабмит в docs/submissions.md имеет тег на main.

  - id: C-L3-1
    role: captain
    level: L3
    cp: CP4
    title: Сторож последней минуты
    why: Если что-то зависнет, к 3:00 у нас всё равно должен лежать лучший ответ.
    steps:
      - Проверить, что любой путь кода оставляет валидный submission.csv (тест с искусственным зависанием).
      - Добавить обработку сигнала остановки и жёсткую отсечку по времени.
    done:
      - Тест «агент убит на середине цикла» — сабмит валиден.
    handoff: qa — включить тест в CI.

  - id: C-L3-2
    role: captain
    level: L3
    cp: CP5
    title: Заморозка кода и финальный сабмит
    why: Последний день — только стабильность.
    steps:
      - 26.10 18:00 — объявить заморозку: дальше только багфиксы по согласованию.
      - Выбрать финальную версию по журналу сабмитов и харнессу (она же должна быть лучшей на public).
      - Пройти чек-лист релиза из docs/checkpoints.md.
    done:
      - Чек-лист релиза закрыт, финальная версия на платформе.
    handoff: research — питч, qa — финальная репетиция.

  # ======================================================================= agent
  - id: A-L0-1
    role: agent
    level: L0
    cp: CP0
    title: Разогрев — запустить агента и разобраться в цикле
    why: Понять, как сейчас устроены разбор задачи, гипотезы и цикл, прежде чем менять.
    steps:
      - "`uv run python solution.py tasks/public/multiclass/task.md` с `AGENT_TIME_BUDGET_SEC=300` и `LLM_MOCK=1`."
      - "В Claude: `/explain agent/loop.py` и `/explain agent/llm_client.py`."
      - Первый маленький PR — тест на `LLMClient.chat_json` (JSON в ```json, мусор, пустой ответ) через сабагента test-writer.
    done:
      - Твой первый PR в dev слит, ты можешь объяснить цикл AutoResearch своими словами.

  - id: A-L1-1
    role: agent
    level: L1
    cp: CP2
    title: Подключить настоящий Qwen
    why: Без проверенного вызова LLM нельзя строить умную часть.
    steps:
      - Получить ключ у капитана лично, вписать в .env (не в чат!).
      - "`uv run python scripts/doctor.py --role agent --llm` — ✅ запрос к LLM."
      - Замерить время ответа и токены на типичный промпт, записать в docs/experiments.md.
    done:
      - doctor с `--llm` зелёный, известны скорость и стоимость одного запроса.
    handoff: captain выдаёт ключ; цена токенов — из ответа организаторов (C-L1-2).

  - id: A-L1-2
    role: agent
    level: L1
    cp: CP3
    title: Папка промптов и формат ответа LLM
    why: Промпты должны быть файлами, которые видно в ревью, а ответы — проверяемыми.
    steps:
      - Создать agent/prompts/ (system.md, hypotheses.md) с плейсхолдерами для TaskSpec, DataProfile, истории.
      - Описать в промпте JSON-формат ответа, совпадающий с Hypothesis, и пример (few-shot из playbook).
      - Тест — рендер промпта на stub-данных.
    done:
      - Промпты в файлах, тест рендера зелёный.

  - id: A-L2-1
    role: agent
    level: L2
    cp: CP3
    title: Гипотезы от LLM в propose_hypotheses
    why: Главная «умная» часть кейса — агент сам формулирует гипотезы.
    steps:
      - "LLM получает: тип задачи, метрику, сжатый DataProfile, историю итогов экспериментов."
      - Ответ → валидация через Hypothesis → отброс невалидных и повторов → fallback на playbook.
      - Тесты с подменой LLM (хороший ответ / мусор / None) — цикл не падает.
    done:
      - При `LLM_MOCK=0` агент проверяет гипотезы, которых нет в playbook; при `LLM_MOCK=1` всё работает как раньше.
    handoff: ml — список поддерживаемых params (ежедневно 13:00).

  - id: A-L2-2
    role: agent
    level: L2
    cp: CP3
    title: Память экспериментов и рефлексия
    why: Агент должен помнить, что уже пробовал, и понимать, почему не сработало.
    steps:
      - Сжатое представление истории для промпта (таблица гипотеза → метрика ± std → принята/нет).
      - После неудачи — короткая «рефлексия» LLM (почему, что попробовать иначе), сохраняется в историю.
      - Ограничить длину контекста (последние N + лучшие K).
    done:
      - Промпт укладывается в лимит, повторных гипотез нет на прогоне 30 минут.

  - id: A-L2-3
    role: agent
    level: L2
    cp: CP4
    title: Честное правило принятия гипотезы
    why: Сейчас порог шума отсёк улучшение 41.81 → 41.62 на регрессии; нужно правило, которое не пропускает шум, но не душит реальные улучшения.
    steps:
      - Сравнивать по фолдам попарно (одинаковые разбиения), а не только средние.
      - Подобрать правило на истории экспериментов (с research), записать решение в docs/decisions/.
    done:
      - ADR с правилом, тест на граничные случаи.
    handoff: research — данные экспериментов для проверки правила.

  - id: A-L3-1
    role: agent
    level: L3
    cp: CP4
    title: LLM пишет код признаков (в песочнице)
    why: Признаки, придуманные под конкретные данные, — то, чего не умеет обычный AutoML.
    steps:
      - "Новый вид гипотезы: `kind: features` с полем code (функция df → df)."
      - Исполнять только через runtime/sandbox (C-L2-1), проверять результат на train-фолдах.
      - Защита от утечек — код не видит target теста.
    done:
      - На харнессе хотя бы одна задача улучшилась за счёт сгенерированного признака.
    handoff: captain — песочница; ml — применение признаков внутри CV.

  - id: A-L3-2
    role: agent
    level: L3
    cp: CP4
    title: Роли внутри агента — аналитик, генератор, критик
    why: Критик отсеивает гипотезы с утечками и «подгонкой» до того, как на них потрачено время.
    steps:
      - Разделить промпты по ролям; критик проверяет гипотезу по чек-листу (утечка, универсальность, цена по времени).
      - Сравнить на харнессе с одноролевым вариантом.
    done:
      - Решение (оставляем или нет) записано в docs/decisions/ с цифрами.

  # ======================================================================= ml
  - id: M-L0-1
    role: ml
    level: L0
    cp: CP0
    title: Разогрев — прогнать эксперимент и прочитать ml/
    why: Понять, как гипотеза превращается в кросс-валидацию и ответ.
    steps:
      - "`/explain ml/experiment.py`, затем `/explain кросс-валидация`."
      - Первый PR — тест на `make_matrix`, когда в test есть категория, которой нет в train.
    done:
      - Твой первый PR в dev слит.

  - id: M-L1-1
    role: ml
    level: L1
    cp: CP3
    title: CatBoost в run_experiment
    why: CatBoost обычно сильнее на категориальных признаках — нужен агенту как вариант.
    steps:
      - "`uv sync --group full`. Ключ `params.model: catboost` в experiment.py (+ docstring)."
      - Категории — через встроенную обработку CatBoost; ранняя остановка на валидации фолда.
      - Тест на маленьких данных; пример гипотезы — передать research для playbook.
    done:
      - Гипотеза с CatBoost проходит на обеих публичных задачах, тест зелёный.
    handoff: agent и research — новый ключ params (13:00).

  - id: M-L1-2
    role: ml
    level: L1
    cp: CP3
    title: Ещё модели для разнообразия (XGBoost, линейная)
    why: Разные модели ошибаются по-разному — это основа для ансамблей.
    steps:
      - "`model: xgboost` и `model: linear` (Ridge/LogisticRegression с масштабированием и one-hot)."
      - Тесты, примеры в playbook.
    done:
      - Три типа моделей доступны через params.

  - id: M-L1-3
    role: ml
    level: L1
    cp: CP3
    title: Защита по времени и памяти внутри эксперимента
    why: Скрытая задача может быть в 10 раз больше публичной.
    steps:
      - Оценка памяти матрицы до обучения; при нехватке — подвыборка для CV с записью в лог.
      - Прогноз длительности по первому фолду; если не успеваем — меньше фолдов или стоп.
    done:
      - Тест на «большой» синтетике (1–2 млн строк, мало признаков) не падает и укладывается в бюджет.
    handoff: captain — доли бюджета (C-L2-2).

  - id: M-L2-1
    role: ml
    level: L2
    cp: CP4
    title: Схемы валидации через params
    why: В регрессии одно здание встречается в разные годы — случайные фолды завышают оценку.
    steps:
      - "`params.validation`: kfold | stratified | group(колонка) | time(колонка)."
      - Вместе с research проверить, какая схема лучше предсказывает public.
    done:
      - Схемы доступны, решение по умолчанию записано в docs/decisions/.
    handoff: research — исследование валидации (R-L2-1).

  - id: M-L2-2
    role: ml
    level: L2
    cp: CP4
    title: Библиотека преобразований признаков
    why: Агенту нужны готовые «кубики», которые он комбинирует гипотезами.
    steps:
      - "`params.feature_ops`: индикаторы пропусков, частотное кодирование, target encoding внутри фолдов, разности/отношения пар признаков."
      - Каждая операция — функция + тест на утечку (обучается только на train-части).
    done:
      - ≥ 4 операции, описаны в docstring, есть примеры в playbook.

  - id: M-L2-3
    role: ml
    level: L2
    cp: CP4
    title: Подбор гиперпараметров Optuna с лимитом времени
    why: Дешёвый прирост качества, если уложиться во время.
    steps:
      - "`kind: hyperparams` с `params.optuna: {trials, timeout}`; поиск на подвыборке/меньшем числе фолдов."
      - Сравнить с ручными гипотезами по времени и качеству.
    done:
      - Гипотеза работает с жёстким таймаутом, результат в журнале.

  - id: M-L3-1
    role: ml
    level: L3
    cp: CP4
    title: Ансамбль лучших моделей по OOF
    why: Смесь разных моделей почти всегда лучше одной.
    steps:
      - Сохранять OOF и test-предсказания экспериментов (пути в ExperimentResult).
      - "`kind: ensemble`: взвешенное среднее топ-k, веса — по OOF."
      - Финал — ансамбль, если он лучше лучшей модели с учётом шума.
    done:
      - На харнессе ансамбль не хуже лучшей одиночной модели ни на одной задаче.
    handoff: captain — финальное обучение в solution.py.

  - id: M-L3-2
    role: ml
    level: L3
    cp: CP4
    title: Пороги и веса классов под Macro F1
    why: Macro F1 сильно зависит от редких классов.
    steps:
      - Подбор множителей вероятностей классов на OOF (не на тесте!).
      - Проверка на шум — сравнение по фолдам.
    done:
      - Улучшение Macro F1 на OOF больше шума; записано в журнал.

  # ======================================================================= research
  - id: R-L0-1
    role: research
    level: L0
    cp: CP0
    title: Разогрев — кейс, данные, глоссарий
    why: Ты отвечаешь за знание задачи и за историю для жюри.
    steps:
      - Прочитать PDF кейса (reference/), особенно разделы про AutoResearch и формулы баллов.
      - "`uv sync --group research`, открыть публичные задачи в ноутбуке (`research/notebooks/`)."
      - Первый PR — 3–5 терминов, которых не хватило, в docs/glossary.md.
    done:
      - Твой первый PR в dev слит.

  - id: R-L1-1
    role: research
    level: L1
    cp: CP2
    title: EDA публичных задач — что важно для агента
    why: Нужно понять, какие особенности данных агент должен уметь распознавать на ЛЮБОЙ задаче.
    steps:
      - "Регрессия: распределение target, выбросы, повтор зданий по годам (риск утечки в CV)."
      - "Классификация: дисбаланс классов, категориальные признаки, константы."
      - Выводы — короткий отчёт docs/research/eda.md + список «что агент должен проверять сам».
    done:
      - Отчёт в dev, выводы рассказаны на стендапе.
    handoff: ml и agent — список проверок для DataProfile.

  - id: R-L1-2
    role: research
    level: L1
    cp: CP3
    title: Playbook v1 — 10+ универсальных гипотез
    why: Это «база знаний» агента, когда LLM недоступна, и примеры для LLM.
    steps:
      - Взять идеи из docs/resources/research.md (AIDE, DS-Agent, Kaggle-практики).
      - Каждую — проверить на обеих публичных задачах, оставить универсальные.
      - Формат — шапка research/playbook.yaml; новые params — только существующие (или по согласованию с ml).
    done:
      - ≥ 10 гипотез в playbook, каждая с обоснованием, PR слит к 22.10 13:00.
    handoff: "agent — 22.10 13:00; ml — новые params."

  - id: R-L1-3
    role: research
    level: L1
    cp: CP3
    title: Тренировочные «скрытые» задачи
    why: Единственный способ проверить универсальность до private.
    steps:
      - Скрипт scripts/make_practice_tasks.py → tasks/practice/<имя>/ в формате платформы + скрытый answers.csv.
      - "≥ 4 задачи: бинарная с ROC-AUC, регрессия с MAE, многоклассовая с accuracy, задача с «кривым» task.md."
      - Источники — sklearn.datasets (без интернета) и переделки публичных задач.
    done:
      - "`scripts/run_local.py --all` проходит на всех задачах; QA может считать баллы."
    handoff: qa — харнесс (Q-L1-1), к 22.10 18:30.

  - id: R-L2-1
    role: research
    level: L2
    cp: CP4
    title: Какая валидация предсказывает public
    why: Если локальная оценка врёт, все улучшения — лотерея.
    steps:
      - Сравнить KFold, GroupKFold, временной сплит на регрессии; стратификацию на классификации.
      - Сопоставить с public из docs/submissions.md.
    done:
      - Вывод и рекомендация в docs/decisions/; ml включает схему по умолчанию.
    handoff: ml — M-L2-1.

  - id: R-L2-2
    role: research
    level: L2
    cp: CP3
    title: Обзор чужих решений AutoML-агентов
    why: Не изобретать велосипед — взять лучшие идеи из AIDE, DS-Agent, autoresearch.
    steps:
      - По docs/resources/research.md — по 15 минут на каждое решение, выписать 1–2 идеи.
      - Каждая идея → issue по шаблону «Гипотеза».
    done:
      - ≥ 5 issue-гипотез с источником.

  - id: R-L2-3
    role: research
    level: L2
    cp: CP4
    title: Каркас питча и план слайдов
    why: Питч — отдельная задача, а не «в последний час».
    steps:
      - История в 5 предложениях в docs/pitch/README.md.
      - План 5–7 слайдов, список цифр и графиков, которые нужны.
    done:
      - Черновик истории и плана показан команде на вечернем ретро.

  - id: R-L3-1
    role: research
    level: L3
    cp: CP5
    title: Слайды, демо-видео, репетиция
    why: Сильный продукт без понятной истории проигрывает.
    steps:
      - Слайды по плану, демо 2–3 минуты (агент на незнакомой задаче), README для жюри — с капитаном.
      - Репетиция с таймером и вопросами из docs/pitch/README.md.
    done:
      - Всё в docs/pitch/, репетиция проведена 26.10.

  # ======================================================================= qa
  - id: Q-L0-1
    role: qa
    level: L0
    cp: CP0
    title: Разогрев — тесты, CI, doctor
    why: Ты хозяин качества — нужно знать, что и как проверяется сейчас.
    steps:
      - "`uv run pytest -v`, открыть последний запуск CI на GitHub (Actions)."
      - "`/explain scripts/doctor.py` и `/explain tests/smoke/test_end_to_end.py`."
      - Первый PR — тест на `find_metric_in_text` для 3 новых формулировок (в т.ч. по-русски).
    done:
      - Твой первый PR в dev слит; ты помогаешь остальным пройти CP0.

  - id: Q-L1-1
    role: qa
    level: L1
    cp: CP3
    title: Харнесс — локальный лидерборд
    why: Платформа даёт 3 сабмита в день; всё остальное мы должны оценивать сами.
    steps:
      - evaluation/harness.py — отложить 20–30% train как «скрытый тест», запустить solution.py, посчитать метрику.
      - evaluation/local_score.py — балл по формуле организаторов (приложение 3 кейса) относительно нашего простого бейзлайна.
      - "`--all` по tasks/public и tasks/practice → CSV-отчёт (коммит, задача, метрика, балл, время, RAM)."
    done:
      - Одна команда даёт таблицу баллов по всем задачам.
    handoff: research — тренировочные задачи (R-L1-3); все — пользуются харнессом.

  - id: Q-L1-2
    role: qa
    level: L1
    cp: CP2
    title: Проверка перед сабмитом (scripts/pre_submit.py)
    why: Ошибка формата = потерянный сабмит из трёх в день.
    steps:
      - Собрать zip → распаковать во временную папку → запустить оттуда на копиях задач с лимитом времени.
      - Проверить сабмит валидатором; проверить импорты (только requirements.txt).
    done:
      - Скрипт используется в /submit-check, капитан сабмитит только после него.
    handoff: captain — каждый вечер перед сабмитом.

  - id: Q-L1-3
    role: qa
    level: L1
    cp: CP3
    title: Расширить реестр метрик
    why: Скрытые задачи могут прийти с метрикой, которой нет у нас.
    steps:
      - "Добавить: RMSLE-варианты, weighted/multiclass ROC-AUC, Gini, precision/recall, MAPE-варианты — что разумно."
      - Русские и английские формулировки в aliases; тесты на поиск в тексте.
    done:
      - Тесты на ≥ 20 формулировок метрик зелёные.
    handoff: agent — разбор задачи использует реестр.

  - id: Q-L2-1
    role: qa
    level: L2
    cp: CP4
    title: Набор тестов на устойчивость
    why: Скрытая задача может быть «кривой» — агент не должен падать.
    steps:
      - "Варианты: нет sample_submission, лишние файлы, CRLF, пустые колонки, unicode в именах, target с пропусками, 1 объект в классе."
      - Каждый — дымовой тест, агент обязан сдать валидный ответ.
    done:
      - ≥ 8 тестов устойчивости в CI.
    handoff: owners модулей — чинят найденное.

  - id: Q-L2-2
    role: qa
    level: L2
    cp: CP4
    title: Генеральная репетиция — 3 часа
    why: Убедиться, что агент выдерживает полный бюджет времени и памяти.
    steps:
      - Codespaces 4 ядра / 16 ГБ (см. docs/decisions/0005); прогон обеих задач по 180 минут.
      - Снять пиковую память и время этапов, отчёт в docs/experiments.md.
    done:
      - Полный прогон без падений, отчёт команде.
    handoff: captain — доли бюджета; ml — память.

  - id: Q-L3-1
    role: qa
    level: L3
    cp: CP4
    title: Отчёт харнесса в каждом PR
    why: Видеть, улучшает ли PR агента, до слияния.
    steps:
      - Workflow (по метке PR или вручную) запускает харнесс с коротким бюджетом и пишет таблицу в комментарий PR.
    done:
      - Таблица «было/стало» появляется в PR по метке.

  - id: Q-L3-2
    role: qa
    level: L3
    cp: CP5
    title: Финальная проверка релиза
    why: Последний сабмит должен быть безупречным.
    steps:
      - Пройти чек-лист релиза из docs/checkpoints.md вместе с капитаном.
      - Финальный прогон харнесса и pre_submit на финальном теге.
    done:
      - Чек-лист релиза закрыт.
