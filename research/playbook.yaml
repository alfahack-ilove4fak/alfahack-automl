# Playbook гипотез. Владелец — Research/DS.
# Агент берёт отсюда гипотезы, когда LLM недоступна, и показывает их LLM как примеры.
# Каждая гипотеза должна быть ПОЛЕЗНОЙ НА ЛЮБОЙ табличной задаче, а не только на публичных.
#
# Поля:
#   id          — уникальный, латиница
#   kind        — baseline | model | hyperparams | features | preprocessing | validation | ensemble
#   title       — что делаем, по-русски
#   rationale   — почему это может помочь
#   task_types  — [regression, binary, multiclass]; нет поля — подходит всем
#   requires    — categorical | imbalance (необязательно)
#   params      — то, что понимает ml/experiment.py (список поддерживаемых — в его docstring)
#
# v2 (22.10): порядок — по стенду в схеме агента (choose_validation + acceptance.accept) на 10 задачах
# (2 public + 8 tasks/practice): доля задач, где гипотеза честно лучше бейзлайна, потом медиана честного выигрыша
# (цифры, ложные принятия и что не вошло — docs/research/playbook-v2.md). Новое: модели xgboost / catboost / hist_gb,
# lgbm_default (страховка, #206) и комбинации с xgboost. xgboost_balanced_proba_weights — строго после
# balanced_proba_weights: против бейзлайна на payments её принимают зря, против balanced_proba_weights — нет.
# objective_metric (#255) — цель под метрику с любым α, первой в блоке; objective_* (#237) — запасные: цель обучения под метрику, только регрессия; стенд на 8 задачах — ложных принятий нет
# (неподходящая цель видна в CV хуже и отклоняется). Порядок блока — по стенду (docs/research/objective-metric.md).
# Цикл проверяет гипотезы по отдельности и не складывает выигрыши (issue #87), поэтому есть комбинации.
# Проверка: uv run pytest tests/unit/test_playbook.py; стенд: uv run python research/bench_playbook.py

hypotheses:
  - id: balanced_proba_weights
    kind: hyperparams
    title: Веса классов + множители вероятностей под метрику по меткам
    rationale: Macro F1 зависит от редких классов; множители подбираются на OOF и проверяются кросс-подгонкой. Действует только для метрик по меткам (на ROC-AUC/logloss — как balanced_classes). Стенд v2 — честно лучше на 3/3 задачах с дисбалансом (медиана +15%)
    task_types: [binary, multiclass]
    requires: imbalance
    params: {model: lightgbm, class_weight: balanced, proba_weights: true}

  - id: balanced_classes
    kind: hyperparams
    title: Веса классов balanced
    rationale: При дисбалансе Macro F1 сильно зависит от редких классов; веса заставляют модель их замечать
    task_types: [binary, multiclass]
    requires: imbalance
    params: {model: lightgbm, class_weight: balanced}

  - id: log_target
    kind: preprocessing
    title: Обучение на log1p(target)
    rationale: Скошенный положительный таргет — модель меньше «гоняется» за редкими большими значениями
    task_types: [regression]
    params: {model: lightgbm, log_target: true}

  - id: log_target_slow
    kind: preprocessing
    title: log1p(target) + медленный шаг (комбинация)
    rationale: Скошенный положительный таргет и меньший шаг вместе — цикл сам выигрыши не складывает
    task_types: [regression]
    params: {model: lightgbm, log_target: true, model_params: {learning_rate: 0.02}}

  - id: xgboost_log_target
    kind: model
    title: XGBoost на log1p(target) (комбинация)
    rationale: Цикл не складывает выигрыши (#87); XGBoost и log1p по отдельности честно лучше на регрессии
    task_types: [regression]
    params: {model: xgboost, log_target: true}

  - id: objective_metric
    kind: hyperparams
    title: LightGBM с целью обучения под метрику задачи
    rationale: Цель подбирается по метрике (ml/experiment.METRIC_OBJECTIVES) — pinball@α → квантиль с этим α, MAE/WAPE → L1, MAPE, Huber, девиансы; у метрик без своей цели (RMSE) — L2, как бейзлайн. Покрывает любые α, в отличие от objective_quantile_90 (#237, #255)
    task_types: [regression]
    params: {model: lightgbm, objective: metric}

  - id: objective_poisson
    kind: hyperparams
    title: LightGBM с целью Poisson
    rationale: Счётный неотрицательный таргет — лог-линейная интенсивность; на отрицательном таргете гипотеза честно падает (FAILED)
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: poisson}}

  - id: objective_tweedie
    kind: hyperparams
    title: LightGBM с целью Tweedie
    rationale: Много нулей и скошенные положительные значения (убытки, продажи)
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: tweedie}}

  - id: objective_mape
    kind: hyperparams
    title: LightGBM с целью MAPE
    rationale: При MAPE/WAPE ошибка на маленьких значениях дороже — L2 их недооценивает
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: mape}}

  - id: objective_quantile_90
    kind: hyperparams
    title: LightGBM с целью quantile α=0.9
    rationale: Квантильная метрика с уровнем 0.9 — нужна верхняя граница, а не среднее
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: quantile, alpha: 0.9}}

  - id: objective_huber
    kind: hyperparams
    title: LightGBM с целью Huber
    rationale: Тяжёлые хвосты и выбросы в таргете — квадрат ошибки гоняется за ними, Huber — нет
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: huber}}

  - id: objective_l1
    kind: hyperparams
    title: LightGBM с целью L1 (медиана)
    rationale: Метрика MAE или pinball@0.5 оптимизируется медианой, а не средним; L1 устойчивее к выбросам
    task_types: [regression]
    params: {model: lightgbm, model_params: {objective: l1}}

  - id: lgbm_slow_regularized
    kind: hyperparams
    title: Медленный шаг + регуляризация (комбинация)
    rationale: Цикл проверяет гипотезы по отдельности и не складывает выигрыши; эта комбинация объединяет надёжные идеи
    params: {model: lightgbm, model_params: {learning_rate: 0.02, num_leaves: 31, min_child_samples: 50, reg_lambda: 1.0, colsample_bytree: 0.5}}

  - id: lgbm_extra_trees
    kind: hyperparams
    title: LightGBM со случайными порогами (extra_trees)
    rationale: Случайный порог — сильная регуляризация, модель хуже запоминает объекты train; полезно, когда test сдвинут относительно train
    params: {model: lightgbm, model_params: {extra_trees: true}}

  - id: lgbm_strong_reg
    kind: hyperparams
    title: LightGBM с сильной L1/L2-регуляризацией листьев
    rationale: Штраф на значения листьев сглаживает предсказания и снижает переобучение без смены структуры деревьев
    params: {model: lightgbm, model_params: {reg_alpha: 1.0, reg_lambda: 10.0}}

  - id: xgboost_balanced_proba_weights
    kind: model
    title: XGBoost + веса классов + множители вероятностей (комбинация)
    rationale: Цикл не складывает выигрыши (#87); лучшая модель и лучшая гипотеза для метрик по меткам при дисбалансе
    task_types: [binary, multiclass]
    requires: imbalance
    params: {model: xgboost, class_weight: balanced, proba_weights: true}

  - id: lgbm_shallow
    kind: hyperparams
    title: LightGBM с ограниченной глубиной деревьев
    rationale: Неглубокие деревья ловят простые взаимодействия и меньше переобучаются на небольших данных
    params: {model: lightgbm, model_params: {max_depth: 6, num_leaves: 40}}

  - id: xgboost
    kind: model
    title: XGBoost (гистограммы, категории one-hot до 64 значений)
    rationale: Другой бустинг — другие ошибки; растит деревья по уровням, а не по листьям, что устойчивее на малых и шумных данных
    params: {model: xgboost}

  - id: lgbm_feature_subsample
    kind: hyperparams
    title: LightGBM с половиной признаков на дерево
    rationale: При многих похожих признаках деревья меньше цепляются за один и тот же сильный признак, ансамбль разнообразнее
    params: {model: lightgbm, model_params: {colsample_bytree: 0.5}}

  - id: lgbm_small_leaves
    kind: hyperparams
    title: LightGBM с меньшим числом листьев и регуляризацией
    rationale: Защита от переобучения на небольших и шумных данных
    params: {model: lightgbm, model_params: {num_leaves: 31, min_child_samples: 50, reg_lambda: 1.0}}

  - id: lgbm_smooth_leaves
    kind: hyperparams
    title: LightGBM с крупными сглаженными листьями
    rationale: Минимум 100 объектов в листе и path_smooth стягивают значения малых листьев к родителю — устойчивее на шумных данных
    params: {model: lightgbm, model_params: {min_child_samples: 100, path_smooth: 10.0}}

  - id: target_encoding
    kind: features
    title: Target encoding категорий (out-of-fold)
    rationale: Среднее target по категории со сглаживанием — даёт бустингу то, что CatBoost делает сам; без утечки
    requires: categorical
    params: {model: lightgbm, feature_ops: [target_encoding]}

  - id: freq_encoding
    kind: features
    title: Частота категории как признак
    rationale: Редкие и новые значения получают маленькую частоту, а не «неизвестно» — устойчивее к сдвигу test
    requires: categorical
    params: {model: lightgbm, feature_ops: [freq_encoding]}

  - id: pair_ops
    kind: features
    title: Разности и отношения пар информативных признаков
    rationale: Деревья плохо строят отношения признаков сами; 5 лучших признаков → 20 новых колонок
    params: {model: lightgbm, feature_ops: [pair_ops]}

  - id: object_history
    kind: features
    title: История объекта по прошлым периодам
    rationale: Когда один объект повторяется из периода в период, его прошлый target — сильный признак; ключ и время ищутся правилом по данным, история — строго из прошлых периодов и только по train-части фолда. Нет повторяющихся объектов — операция ничего не добавляет
    params: {model: lightgbm, feature_ops: [object_history]}

  - id: hist_gb
    kind: model
    title: HistGradientBoosting из scikit-learn
    rationale: Самый быстрый бустинг, категории нативно; третья реализация бустинга — другие ошибки, кандидат в ансамбль
    params: {model: hist_gb}

  - id: lgbm_default
    kind: model
    title: LightGBM с параметрами библиотеки по умолчанию
    rationale: Страховка от «хуже простейшей модели» (#206) — 100 деревьев, шаг 0.1, все строки и признаки; на малых данных умолчания бывают лучше нашей настройки
    params: {model: lightgbm, model_params: {n_estimators: 100, learning_rate: 0.1, num_leaves: 31, subsample: 1.0, subsample_freq: 0, colsample_bytree: 1.0}}

  - id: catboost
    kind: model
    title: CatBoost (симметричные деревья, кодирование категорий по порядку)
    rationale: Сильнее всего там, где много категорий; симметричные деревья меньше переобучаются
    params: {model: catboost}

  - id: lgbm_fine_bins
    kind: hyperparams
    title: LightGBM с более точной сеткой порогов
    rationale: Для непрерывных признаков 1023 бина вместо 255 позволяют найти более точные пороги разбиения
    params: {model: lightgbm, model_params: {max_bin: 1023}}
