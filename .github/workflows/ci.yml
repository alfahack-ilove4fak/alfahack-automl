# CI: линтер + все тесты (контракты, юнит, дымовой прогон solution.py) на каждый PR и пуш в dev/main.
# Бюджет: GitHub Free даёт 2000 минут/мес на приватный репозиторий; один прогон ≈ 3–5 минут.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Установить зависимости (ядро + dev)
        run: uv sync

      - name: Ruff — стиль и типичные ошибки
        run: uv run ruff check .

      - name: Тесты — контракты, юнит, дымовой прогон
        run: uv run pytest -v

  lock:
    # Обновляет uv.lock и выкладывает его артефактом (у капитана медленный интернет — lock собираем здесь)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
