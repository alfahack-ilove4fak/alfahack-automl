# CI: линтер + все тесты (контракты, юнит, дымовой прогон solution.py) на каждый PR и пуш в dev/main.
# Бюджет: GitHub Free даёт 2000 минут/мес на приватный репозиторий; один прогон ≈ 3–5 минут.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Установить зависимости (ядро + dev)
        run: uv sync

      - name: Ruff — стиль и типичные ошибки
        run: uv run ruff check .

      - name: Ruff — формат (иначе хук Claude переформатирует чужие файлы в PR)
        run: uv run ruff format --check .

      - name: Тесты — контракты, юнит, дымовой прогон
        run: uv run pytest -v

  contracts:
    # Процесс изменения контрактов (ADR 0009): правка schemas.py/protocols.py требует новой версии и строки в CHANGELOG
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить версию контрактов и журнал изменений
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          python3 scripts/check_contract_change.py --base "origin/$BASE"

  lock:
    # Обновляет uv.lock и выкладывает его артефактом (у капитана медленный интернет — lock собираем здесь)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
